{% extends "base.html" %}

{% block title %}Судоку - {{ Config.APP_NAME }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3><i class="bi bi-grid-3x3-gap-fill"></i> Судоку</h3>
                </div>
                <div class="card-body text-center">
                    <div class="alert alert-secondary mt-3">
                        <i class="bi bi-lightbulb"></i><strong>Совет дня:</strong>
                        <span id="game-tip">{{ Config.MSG_LOADING }}</span>
                    </div>
                    <!-- ИГРОВОЕ ПОЛЕ -->
                    <div id="sudoku-grid" class="d-inline-block mb-4"></div>

                    <!-- КНОПКИ УПРАВЛЕНИЯ -->
                    <div class="d-flex justify-content-center gap-2 mb-3 flex-wrap">
                        <button class="btn btn-outline-primary size-btn" onclick="setSize(4, event)">4x4</button>
                        <button class="btn btn-outline-primary size-btn" onclick="setSize(6, event)">6x6</button>
                        <button class="btn btn-success" id="checkBtn" onclick="checkSudoku()">
                            <i class="bi bi-check-circle"></i> Проверить
                        </button>
                        <button class="btn btn-warning" id="newGame" onclick="newGame()">
                            <i class="bi bi-dice"></i> Новая игра
                        </button>
                        <button class="btn btn-info" onclick="solveSudoku()">
                            <i class="bi bi-lightbulb"></i> Решение
                        </button>
                    </div>

                    <!-- СЧЕТ -->
                    <div class="alert alert-info mt-3" id="score-display">
                        Счет: <span id="score">0</span>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_SAVE_SCORE = "{{ url_for('save_score') }}";
    const GAME_NAME = "{{ game.name }}";
    const MSG_ALREADY_SOLVED = "{{ Config.MSG_ALREADY_SOLVED }}";
    const MSG_CONGRATS = "{{ Config.MSG_CONGRATS }}";
    const MSG_SOLUTION_SHOWN = "{{ Config.MSG_SOLUTION_SHOWN }}";

    // Советы для игры Судоку
    const sudokuTips = [
        "Начинай с чисел, которые встречаются чаще всего.",
        "Используй карандашные заметки, чтобы не забывать варианты.",
        "Если застрял — вернись к началу и перепроверь строки и столбцы."
    ];

    function showRandomTip() {
        const randomIndex = Math.floor(Math.random() * sudokuTips.length);
        const tipElement = document.getElementById("game-tip");
        if (tipElement) {
            tipElement.textContent = sudokuTips[randomIndex];
        }
    }

    let currentSize = 4;
    let grid = [];
    let solution = [];
    let score = 0;
    let solutionShown = false;

    function generateSudoku4x4() {
        const templates = [
            {
                puzzle: [
                    [1, 2, 0, 4],
                    [3, 0, 1, 2],
                    [2, 1, 4, 0],
                    [0, 3, 2, 1]
                ],
                solution: [
                    [1, 2, 3, 4],
                    [3, 4, 1, 2],
                    [2, 1, 4, 3],
                    [4, 3, 2, 1]
                ]
            },
            {
                puzzle: [
                    [0, 1, 0, 3],
                    [4, 0, 2, 0],
                    [0, 3, 0, 1],
                    [2, 0, 4, 0]
                ],
                solution: [
                    [2, 1, 4, 3],
                    [4, 3, 2, 1],
                    [1, 3, 4, 2],
                    [2, 4, 1, 3]
                ]
            }
        ];
        return templates[Math.floor(Math.random() * templates.length)];
    }

    function generateSudoku6x6() {
        const templates = [
            {
                puzzle: [
                    [1, 2, 3, 0, 5, 6],
                    [4, 5, 6, 1, 2, 0],
                    [2, 3, 0, 5, 6, 4],
                    [5, 6, 4, 2, 3, 0],
                    [3, 0, 2, 6, 4, 5],
                    [6, 4, 5, 3, 0, 2]
                ],
                solution: [
                    [1, 2, 3, 4, 5, 6],
                    [4, 5, 6, 1, 2, 3],
                    [2, 3, 1, 5, 6, 4],
                    [5, 6, 4, 2, 3, 1],
                    [3, 1, 2, 6, 4, 5],
                    [6, 4, 5, 3, 1, 2]
                ]
            }
        ];
        return templates[0];
    }

    function createGrid() {
        let html = `<table class="mx-auto size-${currentSize}">`;

        for (let i = 0; i < currentSize; i++) {
            html += '<tr>';
            for (let j = 0; j < currentSize; j++) {
                const value = grid[i] && grid[i][j] !== 0 ? grid[i][j] : '';

                html += `<td>
                    <input type="text"
                           class="sudoku-cell form-control"
                           id="cell-${i}-${j}"
                           value="${value}"
                           maxlength="1"
                           data-row="${i}"
                           data-col="${j}"
                           ${value ? 'readonly' : ''}
                           oninput="validateInput(this)">
                </td>`;
            }
            html += '</tr>';
        }
        html += '</table>';

        document.getElementById('sudoku-grid').innerHTML = html;
        document.getElementById('checkBtn').style.display = 'inline-block';
    }

    function validateInput(input) {
        const val = input.value;
        const maxVal = currentSize;

        if (val && !/^\d+$/.test(val)) {
            input.value = '';
            return;
        }

        const num = parseInt(val);
        if (val && (num < 1 || num > maxVal)) {
            input.value = '';
        }

        input.classList.remove('correct-cell', 'wrong-cell');
    }

    function checkSudoku() {
        if (solutionShown) {
            alert(MSG_ALREADY_SOLVED);
            return;
        }

        let allCorrect = true;
        let currentScore = 0;

        for (let i = 0; i < currentSize; i++) {
            for (let j = 0; j < currentSize; j++) {
                const cell = document.getElementById(`cell-${i}-${j}`);
                const val = cell.value ? parseInt(cell.value) : 0;

                cell.classList.remove('correct-cell', 'wrong-cell');

                if (val === solution[i][j]) {
                    cell.classList.add('correct-cell');
                    currentScore += 10;
                } else if (val !== 0) {
                    cell.classList.add('wrong-cell');
                    allCorrect = false;
                } else {
                    allCorrect = false;
                }
            }
        }

        score = currentScore;
        document.getElementById('score').textContent = score;

        if (allCorrect) {
            alert(MSG_CONGRATS);
            saveScore(score);
        }
    }

    function newGame() {
        let gameData;

        switch (currentSize) {
            case 4:
                gameData = generateSudoku4x4();
                break;
            case 6:
                gameData = generateSudoku6x6();
                break;
            default:
                currentSize = 4;
                gameData = generateSudoku4x4();
        }

        grid = gameData.puzzle;
        solution = gameData.solution;
        score = 0;
        solutionShown = false;

        createGrid();
        document.getElementById('score').textContent = '0';
        document.getElementById('checkBtn').style.display = 'inline-block';
    }

    function solveSudoku() {
        for (let i = 0; i < currentSize; i++) {
            for (let j = 0; j < currentSize; j++) {
                const cell = document.getElementById(`cell-${i}-${j}`);
                cell.value = solution[i][j];
                cell.classList.add('solved-cell');
                cell.classList.remove('correct-cell', 'wrong-cell');
            }
        }

        solutionShown = true;
        document.getElementById('checkBtn').style.display = 'none';

        alert(MSG_SOLUTION_SHOWN);
    }

    function setSize(size, evt) {
        currentSize = size;

        document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('active'));
        if (evt && evt.target) evt.target.classList.add('active');

        newGame();
    }

    function saveScore(score) {
        fetch(API_SAVE_SCORE, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                game: GAME_NAME,
                score: score
            })
        }).catch(err => console.error('Error saving score:', err));
    }

    document.addEventListener('DOMContentLoaded', function () {
        showRandomTip();
        newGame();
    });
</script>
{% endblock %}
