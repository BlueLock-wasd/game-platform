{% extends "base.html" %}

{% block title %}Админ панель{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-shield-lock"></i> Админ панель</h2>
        <a href="{{ url_for('admin_users') }}" class="btn btn-primary">
            <i class="bi bi-people"></i> Управление пользователями
        </a>
    </div>
    
    <div class="row">
        <div class="col-md-3">
            <div class="card text-white bg-primary">
                <div class="card-body">
                    <h5>Пользователи</h5>
                    <h2>{{ users|length }}</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-success">
                <div class="card-body">
                    <h5>Админы</h5>
                    <h2>{{ admins_count }}</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-info">
                <div class="card-body">
                    <h5>Всего игр</h5>
                    <h2>{{ total_games }}</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-warning">
                <div class="card-body">
                    <h5>Заметок</h5>
                    <h2>{{ total_notes }}</h2>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
